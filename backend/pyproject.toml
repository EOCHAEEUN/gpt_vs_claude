[project]
name = "code-contrast-backend"
version = "0.2.0"
description = "Python comparison and local Ollama tutor API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2,<3", "ruff>=0.11,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
